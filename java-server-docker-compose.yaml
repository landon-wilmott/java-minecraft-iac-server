services:
  mc:
    image: itzg/minecraft-server
    container_name: mc-java-server
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: LATEST
      MEMORY: "4G"
      USE_AIKAR_FLAGS: "TRUE"
      GAMEMODE: survival
      DIFFICULTY: normal
      MOTD: "Welcome to the Paper Server!"
      MAX_PLAYERS: 10

      # Makes my player an admin
      OPS: "LAW2003"

      # Mod that allows different minecraft client version to work
      MODRINTH_PROJECTS: "viaversion, playit-gg"
      
    volumes:
      - ./data:/data